<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>《數之咒印：禁忌地牢逃脫》・國小六上數學數量關係密室闖關</title>
  <link rel="stylesheet" href="css/escape.css?v=20261005_1">
</head>
<body>

  <!-- 手電筒/火把光暈暗黑遮罩 (理智 <= 30% 時啟動) -->
  <div class="torch-mask" id="torchMask"></div>

  <!-- 石壁背景層 -->
  <div class="dungeon-bg-wrap"></div>

  <!-- 主應用容器 -->
  <div class="app-container" id="gameMain">
    
    <!-- 頂部狀態列 -->
    <header class="top-bar">
      <div class="top-bar-left">
        <span class="badge-tag" id="chamberBadge">🏰 載入密室中...</span>
        <span class="student-tag" id="studentBadge">👤 冒險者</span>
      </div>

      <div class="top-bar-right">
        <!-- 理智值 (Sanity HP) -->
        <div class="sanity-meter" title="理智值：答錯將遭受惡靈詛咒恐懼並消耗理智">
          <span class="sanity-label">理智</span>
          <div class="sanity-track">
            <div class="sanity-fill" id="sanityFill"></div>
          </div>
          <span class="sanity-val" id="sanityVal">100%</span>
        </div>

        <!-- 功能按鈕 -->
        <button type="button" class="icon-btn lang-btn" id="btnLang" title="切換語言 / Switch Language">🌐 English</button>
        <button type="button" class="icon-btn tts-btn" id="btnTTS" title="語音報讀 / Read Aloud">🔊 朗讀</button>
        <button type="button" class="icon-btn journal-btn" id="btnJournal" title="查看線索筆記本 (快捷鍵 J)">
          <span>📖</span><span id="journalBtnText">染血筆記</span>
        </button>
        <button type="button" class="icon-btn" id="btnMute" title="切換音效 (快捷鍵 M)">🔊</button>
        <button type="button" class="icon-btn" id="btnLogout" title="登出並以新座號重新開始">🚪 <span id="logoutBtnText">登出</span></button>
      </div>
    </header>

    <!-- 密室核心探索面板 -->
    <main class="chamber-panel">
      <div class="chamber-heading">
        <div class="chamber-subtitle" id="chamberSubtitle">單元載入中</div>
        <h1 class="chamber-title" id="chamberTitle">密室載入中...</h1>
        <p class="chamber-lore-quote" id="chamberLore">「牆壁深處傳來骨骼摩擦的聲音……解開密碼鎖，逃出這個房間！」</p>
      </div>

      <!-- 劇情情境描述 -->
      <div class="story-box" id="chamberStory">
        正在解構古代地牢密語⋯⋯
      </div>

      <!-- 機關謎題目標 -->
      <div class="target-question-box" id="targetQuestion">
        ⚠️ <strong>開門機關謎語：</strong>計算中...
      </div>

      <!-- 惡靈提示與警報 -->
      <div class="whisper-alert hidden" id="whisperAlert"></div>

      <!-- 實體 4 位旋轉銅鎖掛載點 -->
      <section class="lock-mount-area" id="lockMount">
        <!-- 由 lock-system.js 動態渲染 -->
      </section>
    </main>

  </div>

  <!-- 石門轟鳴推開過場遮罩 (Gate Transition) -->
  <div class="gate-overlay hidden" id="gateOverlay">
    <div class="gate-content">
      <div class="gate-icon">🚪💥</div>
      <div class="gate-title">【石門轟鳴震顫・咒印瓦解】</div>
      <p style="color: #bbb; margin-top: 8px;">踏入下一間幽暗密室⋯⋯</p>
    </div>
  </div>

  <!-- 1. 初次登入與座號輸入彈窗 (Login Modal) -->
  <div class="modal-backdrop hidden" id="loginModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2>🏰 冒險者登錄・踏入禁忌地牢</h2>
      </div>
      <div class="login-body">
        <p class="login-desc">
          歡迎來到《數之咒印：禁忌地牢逃脫》！<br>
          本遊戲依據<strong>國小六年級康軒數學第 03 單元《數量關係》</strong>設計。<br>
          <span style="color: #ffd54f;">⚠️ 系統會依據您的【班級與座號】自動生成您專屬的迷宮數值與開鎖密碼，每位同學題目參數完全不同，無法抄襲！請認真推導！</span>
        </p>

        <div class="form-row-2">
          <div class="form-group">
            <label for="inputClassName">班級代號</label>
            <select id="inputClassName" class="form-input" style="height: 42px;">
              <option value="601" selected>601 班</option>
              <option value="602">602 班</option>
              <option value="603">603 班</option>
              <option value="604">604 班</option>
              <option value="605">605 班</option>
              <option value="606">606 班</option>
              <option value="607">607 班</option>
              <option value="608">608 班</option>
              <option value="609">609 班</option>
              <option value="610">610 班</option>
              <option value="611">611 班</option>
              <option value="612">612 班</option>
            </select>
          </div>
          <div class="form-group">
            <label for="inputSeatNum">座號 (關鍵種子碼)</label>
            <div class="seat-stepper-wrap">
              <button type="button" class="stepper-btn" id="btnSeatDownCurse" aria-label="座號減 1">▼</button>
              <select id="inputSeatNum" class="form-input stepper-select" style="height: 42px;">
                <option value="01" selected>01 號</option>
                <option value="02">02 號</option>
                <option value="03">03 號</option>
                <option value="04">04 號</option>
                <option value="05">05 號</option>
                <option value="06">06 號</option>
                <option value="07">07 號</option>
                <option value="08">08 號</option>
                <option value="09">09 號</option>
                <option value="10">10 號</option>
                <option value="11">11 號</option>
                <option value="12">12 號</option>
                <option value="13">13 號</option>
                <option value="14">14 號</option>
                <option value="15">15 號</option>
                <option value="16">16 號</option>
                <option value="17">17 號</option>
                <option value="18">18 號</option>
                <option value="19">19 號</option>
                <option value="20">20 號</option>
                <option value="21">21 號</option>
                <option value="22">22 號</option>
                <option value="23">23 號</option>
                <option value="24">24 號</option>
                <option value="25">25 號</option>
                <option value="26">26 號</option>
                <option value="27">27 號</option>
                <option value="28">28 號</option>
                <option value="29">29 號</option>
                <option value="30">30 號</option>
                <option value="31">31 號</option>
                <option value="32">32 號</option>
                <option value="33">33 號</option>
                <option value="34">34 號</option>
                <option value="35">35 號</option>
                <option value="36">36 號</option>
                <option value="37">37 號</option>
                <option value="38">38 號</option>
                <option value="39">39 號</option>
                <option value="40">40 號</option>
                <option value="41">41 號</option>
                <option value="42">42 號</option>
                <option value="43">43 號</option>
                <option value="44">44 號</option>
                <option value="45">45 號</option>
              </select>
              <button type="button" class="stepper-btn" id="btnSeatUpCurse" aria-label="座號加 1">▲</button>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="inputNickname">冒險者暱稱 / 姓名</label>
          <input type="text" id="inputNickname" class="form-input" value="勇敢冒險者" placeholder="輸入姓名或代號">
        </div>

        <button type="button" class="btn-start-adventure" id="btnStartAdventure">
          🔥 點燃火把・踏入密室
        </button>
      </div>
    </div>
  </div>

  <!-- 2. 線索筆記本彈窗 (Clue Journal Modal) -->
  <div class="modal-backdrop hidden" id="journalModal">
    <div class="modal-dialog journal-style">
      <div class="modal-header">
        <h2 id="journalTitle">📖 染血筆記本</h2>
        <button type="button" class="btn-close-modal" id="btnCloseJournal">✕</button>
      </div>
      <div class="journal-body">
        <div class="journal-concept-tag" id="journalConcept">核心概念：數量關係</div>
        <ul class="journal-hints-list" id="journalHints">
          <li>前人留下的筆記在此⋯</li>
        </ul>
        <div class="diagram-mount" id="journalDiagramMount">
          <!-- 動態 SVG 圖解渲染在此 -->
        </div>
      </div>
    </div>
  </div>

  <!-- 3. 生還脫出證書結算畫面 (Victory Screen) -->
  <div class="victory-backdrop hidden" id="victoryScreen">
    <!-- 由 game-controller.js 動態渲染 -->
  </div>

  <!-- 程式模組載入 -->
  <script src="js/audio-manager.js?v=20261005_2"></script>
  <script src="js/tts-reader.js?v=20261005_2"></script>
  <script src="js/prng.js?v=20261005_2"></script>
  <script src="js/diagram-renderer.js?v=20261005_2"></script>
  <script src="js/questions.js?v=20261005_2"></script>
  <script src="js/lock-system.js?v=20261005_2"></script>
  <script src="js/game-controller.js?v=20261005_2"></script>

</body>
</html>
